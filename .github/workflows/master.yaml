name: master

on:
  push:
  pull_request_target:
    types: [labeled]
    branches:
      - master

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
  build:
    runs-on: ubuntu-latest
    # Fork code builds only after a maintainer adds 'safe to test', same as the tests job.
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'safe to test')
    needs: lint
    steps:
      - uses: actions/checkout@v6
        with: # code from pull request, pinned to the labeled commit
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - name: Build binary
        run: make build
  tests:
    runs-on: ubuntu-latest

    # https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
    if: contains(github.event.pull_request.labels.*.name, 'safe to test')
    needs: lint
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: false
          # Fork code runs here only after a maintainer adds 'safe to test'.
          allow-unsafe-pr-checkout: true
      - name: Run tests
        env:
          TODOCHECK_ENV: "ci"
          TESTS_GITHUB_APITOKEN: ${{ secrets.TESTS_GITHUB_APITOKEN }}
          TESTS_GITLAB_APITOKEN: ${{ secrets.TESTS_GITLAB_APITOKEN }}
          TESTS_JIRA_APITOKEN: ${{ secrets.TESTS_JIRA_APITOKEN }}
          TESTS_PIVOTALTRACKER_APITOKEN: ${{ secrets.TESTS_PIVOTALTRACKER_APITOKEN }}
          TESTS_REDMINE_PRIVATE_APITOKEN: ${{ secrets.TESTS_REDMINE_PRIVATE_APITOKEN }}
          TESTS_YOUTRACK_PUBLIC_INCLOUD_APITOKEN: ${{ secrets.TESTS_YOUTRACK_PUBLIC_INCLOUD_APITOKEN }}
          TESTS_AZUREBOARDS_PRIVATE_APITOKEN: ${{ secrets.TESTS_AZUREBOARDS_PRIVATE_APITOKEN }}
        run: make test
